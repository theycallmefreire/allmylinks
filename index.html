<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Guilherme Freire (@cyber.freire) — Cybersecurity & Developer. Links oficiais.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- CSS Inlined Diretamente para Evitar Cache do GitHub Pages -->
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111726;
            --card-hover: #162035;
            --border-color: rgba(255, 255, 255, 0.08);
            
            --cyber-cyan: #00f0ff;
            --cyber-cyan-glow: rgba(0, 240, 255, 0.15);
            
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background-color: var(--bg-color);
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #131c31 0%, #0b0f19 70%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        /* Container Principal */
        .container {
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            padding: 24px 0 40px;
            display: flex;
            flex-direction: column;
        }

        /* Perfil */
        .profile {
            text-align: center;
            margin-bottom: 28px;
        }

        .avatar-wrapper {
            width: 96px;
            height: 96px;
            margin: 0 auto 16px;
            border-radius: 50%;
            border: 2px solid var(--cyber-cyan);
            box-shadow: 0 0 20px var(--cyber-cyan-glow);
            overflow: hidden;
            background: #0d1527;
            position: relative;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            max-width: 96px;
            max-height: 96px;
            object-fit: cover;
            object-position: center 20%;
            display: block;
            border-radius: 50%;
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .profile-handle {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--cyber-cyan);
            margin-bottom: 6px;
        }

        .profile-role {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Seção de Links */
        .links-section {
            width: 100%;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            margin-bottom: 14px;
            padding-left: 4px;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.22s ease;
            cursor: pointer;
        }

        .link-card:hover {
            background: var(--card-hover);
            transform: translateY(-2px);
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35), 0 0 12px var(--cyber-cyan-glow);
        }

        .link-card:active {
            transform: translateY(0);
        }

        /* Ícone */
        .icon-wrapper {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.22s ease;
        }

        .icon {
            width: 20px;
            height: 20px;
        }

        /* Textos do Card */
        .link-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .link-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .link-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        /* Seta de ação */
        .arrow-icon {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .link-card:hover .arrow-icon {
            color: var(--cyber-cyan);
            transform: translate(2px, -2px);
        }

        /* Cores de hover por plataforma */
        .link-instagram:hover {
            border-color: rgba(255, 42, 133, 0.4);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35), 0 0 12px rgba(255, 42, 133, 0.2);
        }
        .link-instagram:hover .icon-wrapper {
            color: #ff2a85;
            background: rgba(255, 42, 133, 0.1);
        }
        .link-instagram:hover .arrow-icon {
            color: #ff2a85;
        }

        .link-tiktok:hover .icon-wrapper {
            color: var(--cyber-cyan);
            background: rgba(0, 240, 255, 0.1);
        }

        .link-linkedin:hover {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35), 0 0 12px rgba(56, 189, 248, 0.2);
        }
        .link-linkedin:hover .icon-wrapper {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
        }
        .link-linkedin:hover .arrow-icon {
            color: #38bdf8;
        }

        .link-github:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }
        .link-github:hover .icon-wrapper {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .link-medium:hover {
            border-color: rgba(0, 255, 136, 0.4);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35), 0 0 12px rgba(0, 255, 136, 0.2);
        }
        .link-medium:hover .icon-wrapper {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }
        .link-medium:hover .arrow-icon {
            color: #00ff88;
        }

        /* TryHackMe Badge */
        .thm-badge {
            margin-top: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            border-radius: 10px;
        }

        .thm-badge iframe,
        .thm-badge img {
            max-width: 100%;
            border: none;
        }

        /* Rodapé */
        .footer {
            margin-top: 28px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
